name: Test Azure Deployment

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deployment environment (must match deployed stack)'
        type: choice
        options:
          - azure-prod
          - azure-uat
        default: azure-prod
      secure_invoke_backend:
        description: 'Secure invoke tool'
        type: choice
        options:
          - python-sdk-v1.0.0
          - cpp-docker-v1.0.0
        default: python-sdk-v1.0.0
  workflow_call:
    inputs:
      deploy_env:
        type: string
        required: true
      secure_invoke_backend:
        description: 'Secure invoke tool'
        type: string
        required: false
        default: python-sdk-v1.0.0

jobs:
  test-azure:
    runs-on: ubuntu-22.04
    environment: ${{ inputs.deploy_env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ORAS
        if: ${{ inputs.secure_invoke_backend != 'cpp-docker-v1.0.0' }}
        uses: oras-project/setup-oras@v1

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_AKS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_AKS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_AKS_SUBSCRIPTION_ID }}

      - name: Find IP address of offer frontend load balancer
        run: |
          az aks get-credentials --resource-group tf-demo-offer-inc-rg --name tf-demo-offer-inc-aks --overwrite-existing
          OFE_IP=$(kubectl get svc ofe-lb -n default -o jsonpath="{.status.loadBalancer.ingress[0].ip}")
          echo "OFE_IP=$OFE_IP" >> $GITHUB_ENV

      - name: Run secure invoke (Python SDK v1.0.0, REST)
        if: ${{ inputs.secure_invoke_backend != 'cpp-docker-v1.0.0' }}
        env:
          KMS_URL: ${{ inputs.deploy_env == 'azure-uat' && 'https://depa-inferencing-kms-uat-azure.ispirt.in' || 'https://depa-inferencing-kms-azure.ispirt.in' }}
          # Crypto binaries are not committed; pulled anonymously from the registry.
          SECURE_INVOKE_LIBS_REF: ${{ vars.SECURE_INVOKE_LIBS_REF || 'ispirt.azurecr.io/depainferencing/tools/secure_invoke_sdk_libs:1.0.0' }}
        working-directory: ./tools/secure-invoke/sdk
        run: |
          set -euo pipefail
          ./scripts/fetch_libs.sh "${SECURE_INVOKE_LIBS_REF}"
          python3 -m pip install --upgrade pip
          python3 -m pip install .

          MAX=3
          for i in $(seq 1 "${MAX}"); do
            echo "Attempt ${i}/${MAX}..."
            if secure-invoke \
                --op invoke \
                --protocol rest \
                --kms-host "${KMS_URL}" \
                --kms-keys-endpoint /app/listpubkeys \
                --offer-host "${OFE_IP}:51052" \
                --offer-endpoint /v1/getbids \
                --request-file "${GITHUB_WORKSPACE}/tools/requests/get_bids_request.json" \
                --insecure \
                --retries 3; then
              echo "secure-invoke succeeded on attempt ${i}."
              exit 0
            fi
            [ "${i}" -lt "${MAX}" ] && sleep 30
          done
          echo "::error::secure-invoke (REST) failed after ${MAX} attempts"
          exit 1

      - name: Run secure invoke (C++ Docker v1.0.0)
        if: ${{ inputs.secure_invoke_backend == 'cpp-docker-v1.0.0' }}
        env:
          KMS_URL: ${{ inputs.deploy_env == 'azure-uat' && 'https://depa-inferencing-kms-uat-azure.ispirt.in' || 'https://depa-inferencing-kms-azure.ispirt.in' }}
        working-directory: ./tools/secure-invoke
        run: |
          REQUESTS_DIR=${GITHUB_WORKSPACE}/tools/requests
          sed -i 's|/home/azureuser/requests|'"$REQUESTS_DIR"'|g' ./.env
          sed -i 's|<KMS_HOST>|'"$KMS_URL"'|g' ./.env
          sed -i 's|<hostname>|'"$OFE_IP"'|g' ./.env
          sed -i '/CA_CERT/d' ./.env
          sed -i '/CLIENT_CERT/d' ./.env
          sed -i '/CLIENT_KEY/d' ./.env
          ./secure_invoke_test.sh
